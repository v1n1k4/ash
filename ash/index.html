<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060208" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Amor Aeternus — Love Heart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Moldura Ornamental da Página -->
  <div class="page-frame" aria-hidden="true"></div>

  <!-- Brasas / Pétalas Carmesim Flutuantes -->
  <div class="embers" id="embers" aria-hidden="true"></div>

  <main class="sanctuary">
    <!-- Cabeçalho Gótico Romântico -->
    <header class="gothic-header">
      <div class="crest">༺ 🥀 ༻</div>
      <h1 class="gothic-title">Amor Aeternus</h1>
      <p class="gothic-subtitle">prometo sempre te amar, sempre estar ao seu lado, eu pertenço a voce, ash</p>
      <div class="ornate-divider">
        <span>❖</span>
      </div>
    </header>

    <!-- Altar Central: Retratos + Coração -->
    <section class="altar-grid">
      <!-- Ala Esquerda (Fotos 1 e 2) -->
      <div class="side-wings left-wing">
        <figure class="portrait-card" data-index="0" data-full="img/foto1.jpg" data-caption="I · In Tenebris Lux">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <div class="portrait-img-wrap">
            <img src="img/foto1.jpg" alt="Retrato Romântico I" loading="lazy" />
          </div>
          <figcaption class="portrait-caption">I · In Tenebris Lux</figcaption>
        </figure>

        <figure class="portrait-card" data-index="1" data-full="img/foto2.jpg" data-caption="II · Anima Gemella">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <div class="portrait-img-wrap">
            <img src="img/foto2.jpg" alt="Retrato Romântico II" loading="lazy" />
          </div>
          <figcaption class="portrait-caption">II · Anima Gemella</figcaption>
        </figure>
      </div>

      <!-- Relicário Central (Canvas da Animação Python) -->
      <div class="heart-reliquary">
        <canvas id="canvas"></canvas>
        <button class="gothic-btn" id="replayBtn" type="button">✦ Renascer o Coração ✦</button>
      </div>

      <!-- Ala Direita (Fotos 3 e 4) -->
      <div class="side-wings right-wing">
        <figure class="portrait-card" data-index="2" data-full="img/foto3.jpg" data-caption="III · Cor Meum">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <div class="portrait-img-wrap">
            <img src="img/foto3.jpg" alt="Retrato Romântico III" loading="lazy" />
          </div>
          <figcaption class="portrait-caption">III · In aeternum tuus</figcaption>
        </figure>

        <figure class="portrait-card" data-index="3" data-full="img/foto4.jpg" data-caption="IV · Semper Fidelis">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <div class="portrait-img-wrap">
            <img src="img/foto4.jpg" alt="Retrato Romântico IV" loading="lazy" />
          </div>
          <figcaption class="portrait-caption">IV · Semper Fidelis</figcaption>
        </figure>
      </div>
    </section>

    <footer class="gothic-footer">
      <div class="ornate-divider">
        <span>❦</span>
      </div>
      <p style="margin-top: 0.7rem;">Você é o amor da minha vida <span>♥</span> Além do tempo, alem da eternidade, ainda vou te amar<span>♥</span></p>
    </footer>
  </main>

  <!-- Modal Lightbox para ver a foto ampliada (com suporte a gestos swipe no celular/tablet) -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualização da Foto">
    <div class="lightbox-frame">
      <button class="lightbox-close" id="lightboxClose" aria-label="Fechar">✕</button>
      <img id="lightboxImg" src="" alt="Retrato Ampliado" />
      <div class="lightbox-controls">
        <button class="lightbox-nav" id="prevPhoto" type="button" aria-label="Foto anterior">‹</button>
        <div class="lightbox-caption" id="lightboxCaption"></div>
        <button class="lightbox-nav" id="nextPhoto" type="button" aria-label="Próxima foto">›</button>
      </div>
    </div>
  </div>

  <script>
    // --- Partículas / Brasas Góticas no Fundo ---
    const embersContainer = document.getElementById("embers");
    const emberCount = window.innerWidth < 640 ? 14 : 24;
    for (let i = 0; i < emberCount; i++) {
      const ember = document.createElement("span");
      ember.className = "ember";
      ember.style.left = `${Math.random() * 100}%`;
      ember.style.animationDuration = `${8 + Math.random() * 12}s`;
      ember.style.animationDelay = `${Math.random() * 10}s`;
      const size = 2 + Math.random() * 3.5;
      ember.style.width = `${size}px`;
      ember.style.height = `${size}px`;
      embersContainer.appendChild(ember);
    }

    // --- Lightbox com Navegação e Swipe para Celular / Tablet ---
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const lightboxClose = document.getElementById("lightboxClose");
    const prevPhotoBtn = document.getElementById("prevPhoto");
    const nextPhotoBtn = document.getElementById("nextPhoto");
    const cards = Array.from(document.querySelectorAll(".portrait-card"));
    let currentPhotoIdx = 0;

    function showPhoto(index) {
      currentPhotoIdx = (index + cards.length) % cards.length;
      const card = cards[currentPhotoIdx];
      lightboxImg.src = card.dataset.full;
      lightboxCaption.textContent = card.dataset.caption;
    }

    cards.forEach((card, idx) => {
      card.addEventListener("click", () => {
        showPhoto(idx);
        lightbox.classList.add("open");
        document.body.classList.add("no-scroll");
      });
    });

    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.classList.remove("no-scroll");
    }

    prevPhotoBtn.addEventListener("click", e => {
      e.stopPropagation();
      showPhoto(currentPhotoIdx - 1);
    });

    nextPhotoBtn.addEventListener("click", e => {
      e.stopPropagation();
      showPhoto(currentPhotoIdx + 1);
    });

    lightboxClose.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", e => {
      if (e.target === lightbox) closeLightbox();
    });

    window.addEventListener("keydown", e => {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showPhoto(currentPhotoIdx - 1);
      if (e.key === "ArrowRight") showPhoto(currentPhotoIdx + 1);
    });

    // Suporte a Swipe (deslizar o dedo para trocar de foto no celular/tablet)
    let touchStartX = 0;
    lightbox.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lightbox.addEventListener("touchend", e => {
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(deltaX) > 45) {
        if (deltaX < 0) showPhoto(currentPhotoIdx + 1);
        else showPhoto(currentPhotoIdx - 1);
      }
    }, { passive: true });

    // --- Animação do Coração (ash.py) ---
    const SC = 21;
    const OY = 20;
    const DURATION = 10;
    const TICK = 16;
    const ANIM = 42;
    const LIFT = 34;
    const GAP = 7;
    const SIZES = [9, 10, 11, 12];
    const FONT = "Arial";
    const BG = "#060208";
    const BGC = [0x06 / 255, 0x02 / 255, 0x08 / 255];
    const FLASH = [1.0, 0.78, 0.78];

    const PHRASES = [
      "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
      "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
      "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
      "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
      "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // 720x720 enquadra o coração com margem mínima, deixando os textos maiores em celulares e tablets
    const LOGICAL_SIZE = 720;

    function setupCanvasResolution() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = LOGICAL_SIZE * dpr;
      canvas.height = LOGICAL_SIZE * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    setupCanvasResolution();

    function createRng(seed) {
      let s = seed >>> 0;
      return {
        random() {
          s += 0x6D2B79F5;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        },
        uniform(a, b) {
          return a + (b - a) * this.random();
        },
        choice(arr) {
          return arr[Math.floor(this.random() * arr.length)];
        },
        shuffle(arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(this.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
        }
      };
    }

    let rng = createRng(11);

    function fontStr(size) {
      return `bold ${size}pt ${FONT}`;
    }

    function measureTextWidth(text, size) {
      ctx.font = fontStr(size);
      return ctx.measureText(text).width;
    }

    function heart(a) {
      const x = 16 * Math.pow(Math.sin(a), 3);
      const y =
        13 * Math.cos(a) -
        5 * Math.cos(2 * a) -
        2 * Math.cos(3 * a) -
        Math.cos(4 * a);
      return [x * SC, y * SC + OY];
    }

    function clamp(v) {
      return Math.max(0.0, Math.min(1.0, v));
    }

    function hx(c) {
      const r = Math.floor(clamp(c[0]) * 255).toString(16).padStart(2, "0");
      const g = Math.floor(clamp(c[1]) * 255).toString(16).padStart(2, "0");
      const b = Math.floor(clamp(c[2]) * 255).toString(16).padStart(2, "0");
      return `#${r}${g}${b}`;
    }

    function mix(a, b, k) {
      return [
        a[0] + (b[0] - a[0]) * k,
        a[1] + (b[1] - a[1]) * k,
        a[2] + (b[2] - a[2]) * k
      ];
    }

    function dim(c, k) {
      return [c[0] * k, c[1] * k, c[2] * k];
    }

    const POLY = [];
    for (let i = 0; i < 720; i++) {
      POLY.push(heart((2 * Math.PI * i) / 720));
    }

    const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
    const YMAX = Math.max(...POLY.map(p => p[1]));
    const YMIN = Math.min(...POLY.map(p => p[1]));
    const CY = (YMAX + YMIN) / 2;

    function spans(y) {
      const xs = [];
      for (const [[x1, y1], [x2, y2]] of EDGES) {
        if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
          xs.push(x1 + ((y - y1) * (x2 - x1)) / (y2 - y1));
        }
      }
      xs.sort((a, b) => a - b);
      const res = [];
      for (let i = 0; i + 1 < xs.length; i += 2) {
        res.push([xs[i], xs[i + 1]]);
      }
      return res;
    }

    function intersect(A, B) {
      const out = [];
      for (const a of A) {
        for (const b of B) {
          const lo = Math.max(a[0], b[0]);
          const hi = Math.min(a[1], b[1]);
          if (hi - lo > 14) {
            out.push([lo, hi]);
          }
        }
      }
      return out;
    }

    function* phraseCycle() {
      while (true) {
        const order = PHRASES.slice();
        rng.shuffle(order);
        for (const item of order) {
          yield item;
        }
      }
    }

    function mathDist(x, y) {
      return Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
    }

    function mathSin(v) {
      return Math.sin(Math.PI * v);
    }

    function build() {
      const cycle = phraseCycle();
      const rowH = 19 + 4;
      const half = rowH / 2;
      const placed = [];

      let y = YMAX - half;
      while (y > YMIN + half) {
        const row = intersect(spans(y + half), spans(y - half));

        for (let [lo, hi] of row) {
          lo += 4;
          hi -= 4;
          let cur = lo + rng.uniform(0, 8);
          const line = [];

          while (true) {
            let fit = null;
            for (let k = 0; k < 10; k++) {
              const text = cycle.next().value;
              const size = rng.choice(SIZES);
              const w = measureTextWidth(text, size);
              if (cur + w <= hi) {
                fit = [text, size, w];
                break;
              }
            }
            if (!fit) break;
            const [text, size, w] = fit;
            line.push([cur + w / 2, text, size, w]);
            cur += w + GAP;
          }

          if (line.length === 0) continue;

          if (line.length > 1) {
            const last = line[line.length - 1];
            const left = hi - (last[0] + last[3] / 2);
            for (let i = 0; i < line.length; i++) {
              line[i][0] += (left * i) / (line.length - 1);
            }
          } else {
            line[0][0] = (lo + hi) / 2;
          }

          for (let i = 0; i < line.length; i++) {
            const [x, text, size] = line[i];
            const edge = i === 0 || i === line.length - 1;
            placed.push({ x, y, text, size, edge });
          }
        }

        y -= rowH;
      }

      const wine = [0.58, 0.0, 0.09];
      const crimson = [0.90, 0.05, 0.14];
      const blood = [0.98, 0.10, 0.16];

      for (const p of placed) {
        const rad = Math.min(1.0, mathDist(p.x, p.y));
        let base = mix(wine, crimson, 0.25 + 0.75 * rad);
        base = mix(base, blood, rng.uniform(0, 0.35) + (p.edge ? 0.3 : 0));
        p.color = base.map(v => Math.min(1, v));
        p.rad = rad;
      }

      const edges = placed.filter(p => p.edge);
      const inner = placed.filter(p => !p.edge);

      const twoPi = 2 * Math.PI;
      edges.sort((a, b) => {
        const angA = ((Math.atan2(a.x, a.y - CY) % twoPi) + twoPi) % twoPi;
        const angB = ((Math.atan2(b.x, b.y - CY) % twoPi) + twoPi) % twoPi;
        return angA - angB;
      });

      for (const p of inner) {
        p._sortKey = -p.rad + rng.uniform(0, 0.08);
      }
      inner.sort((a, b) => a._sortKey - b._sortKey);

      return edges.concat(inner);
    }

    let ORDER = [];
    let orderIdx = 0;
    let RATE = 0;
    let acc = 0.0;
    let spawning = true;
    let spawned = [];
    let active = [];
    let stepTimer = null;
    let shimmerTimer = null;

    function spawn(p) {
      const x = p.x;
      const y = -p.y;
      p.f = 0;
      p.dx = rng.uniform(-10, 10);
      p.sx = x + 2;
      p.sy = y + 3;
      p.hx = x;
      p.hy = y;
      p.mx = x;
      p.my = y - LIFT;
      p.shadowFill = BG;
      p.haloFill = BG;
      p.mainFill = BG;
      p.baseHex = hx(p.color);

      spawned.push(p);
      active.push(p);
    }

    function animate(p) {
      p.f += 1;
      const u = clamp(p.f / ANIM);
      const e = 1 - Math.pow(1 - u, 3);
      const c = p.color;
      const x = p.x;
      const y = -p.y;
      const hover = (1 - e) * LIFT;
      const px = x + p.dx * (1 - e);
      const py = y - hover;

      p.shadowFill = hx(mix(BGC, dim(c, 0.30), e));
      p.haloFill = hx(mix(BGC, dim(c, 0.20), e * e));
      p.hx = px;
      p.hy = py;

      const flash = 0.75 * mathSin(clamp((u - 0.55) / 0.45));
      const col = mix(mix(BGC, c, Math.pow(e, 1.5)), FLASH, flash);
      p.mainFill = hx(col);
      p.mx = px;
      p.my = py;

      if (u >= 1) {
        p.hx = x;
        p.hy = y;
        p.mx = x;
        p.my = y;
        p.mainFill = p.baseHex;
        return false;
      }
      return true;
    }

    function render() {
      ctx.clearRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);

      ctx.save();
      ctx.translate(LOGICAL_SIZE / 2, LOGICAL_SIZE / 2 + 18);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (const p of spawned) {
        const font = fontStr(p.size);
        const big = fontStr(p.size + 1);

        ctx.font = font;
        ctx.fillStyle = p.shadowFill;
        ctx.fillText(p.text, p.sx, p.sy);

        ctx.font = big;
        ctx.fillStyle = p.haloFill;
        ctx.fillText(p.text, p.hx, p.hy);

        ctx.font = font;
        ctx.fillStyle = p.mainFill;
        ctx.fillText(p.text, p.mx, p.my);
      }

      ctx.restore();
    }

    function shimmer() {
      if (spawned.length > 0) {
        const p = rng.choice(spawned);
        p.mainFill = hx(mix(p.color, FLASH, 0.6));
        render();
        setTimeout(() => {
          p.mainFill = p.baseHex;
          render();
        }, 260);
      }
      shimmerTimer = setTimeout(shimmer, 140);
    }

    function step() {
      if (spawning) {
        acc += RATE;
        while (acc >= 1 && orderIdx < ORDER.length) {
          acc -= 1;
          spawn(ORDER[orderIdx++]);
        }
        if (orderIdx >= ORDER.length) {
          spawning = false;
        }
      }

      for (let i = active.length - 1; i >= 0; i--) {
        if (!animate(active[i])) {
          active.splice(i, 1);
        }
      }

      render();

      if (!spawning && active.length === 0) {
        shimmer();
        return;
      }
      stepTimer = setTimeout(step, TICK);
    }

    function startHeart() {
      if (stepTimer) clearTimeout(stepTimer);
      if (shimmerTimer) clearTimeout(shimmerTimer);
      rng = createRng(11);
      ORDER = build();
      orderIdx = 0;
      RATE = ORDER.length / ((DURATION * 1000) / TICK);
      acc = 0.0;
      spawning = true;
      spawned = [];
      active = [];
      render();
      stepTimer = setTimeout(step, 200);
    }

    window.addEventListener("resize", () => {
      setupCanvasResolution();
      render();
    });

    document.getElementById("replayBtn").addEventListener("click", startHeart);
    startHeart();
  </script>
</body>
</html>
